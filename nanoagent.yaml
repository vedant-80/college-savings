_ > nanoagent.plugin.v0001.ManifestConfig:
id: college-savings
name: College Savings Contribution Planner
version: 0.1.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: []

tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  get_college_costs:
    description: Retrieve enrollment timing, program length and annual tuition and housing assumptions
  get_savings_account:
    description: Retrieve existing savings, monthly return and allowed contribution cap
  get_scholarships:
    description: Retrieve scholarship amounts and disbursement months
  get_rules:
    description: Retrieve event order, cost escalation, rounding and minimum contribution rules

tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  plan-college-savings:
    description: College Savings Contribution Planner
    runner: agent
    tools: [get_college_costs, get_savings_account, get_scholarships, get_rules]
    reference: null
    instructions: |-
      Retrieve all scenario data and rules. Find the minimum allowed fixed monthly contribution that pays every expense on time, or demonstrate infeasibility at the contribution cap. Submit the full monthly projection through the horizon or first shortfall. A scholarship received after a due expense cannot repair an earlier shortfall. See CollegeOutput for required fields.
