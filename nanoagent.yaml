_ > nanoagent.plugin.v0001.ManifestConfig:
id: college-savings
name: College Savings Calculator
version: 0.2.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: []

tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  calculate_college_savings:
    description: Calculate the minimum monthly college savings contribution using custom inputs, not a scenario. Ask for months until enrollment, savings, annual college cost in today's money, and years of college if missing; never invent personal facts. Pass null for unspecified rate assumptions or no monthly budget. Python calculates all months; do not project or search manually.

tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  plan-college-savings:
    description: Calculate the minimum monthly college savings contribution using custom inputs, not a scenario. Ask for months until enrollment, savings, annual college cost in today's money, and years of college if missing; never invent personal facts. Pass null for unspecified rate assumptions or no monthly budget. Python calculates all months; do not project or search manually.
    runner: tool
    tools: [calculate_college_savings]
    reference: null
    instructions: Calculate the true minimum contribution independently of the optional budget. Default nominal return is 5% and college-cost inflation 4%. N months until enrollment permits N deposits; contributions stop after the deposit immediately before the first bill. Return a compact independently verified summary with no monthly schedule. For enrollment today, report the minimum additional upfront savings if needed.
